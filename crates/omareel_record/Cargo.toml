[package]
name = "omareel_record"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# The recording side without Qt: the recorder's daemon and command, its state files and helpers,
# the in-process Wayland screen capture, the input and cursor sampling, the region picker, the
# capture exclusion plugin, the camera decisions, and what the launcher and the recording bar
# compute. omareel_qt's launcher and recording bar objects and recording commands call it.
[dependencies]
libc = "0.2"
omareel_core = { path = "../omareel_core" }
# The capture's own Wayland connection, with the pure-Rust backend (no libwayland).
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
