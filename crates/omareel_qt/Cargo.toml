[package]
name = "omareel_qt"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# The Qt side: CXX-Qt objects and C++-callable functions, linked into the omareel binary.
# Logic lives in omareel_core; this crate only converts between it and Qt.
[lib]
crate-type = ["staticlib"]

[dependencies]
cxx = "1"
cxx-qt = "0.10"
cxx-qt-lib = { version = "0.10", features = ["qt_gui"] }
omareel_core = { path = "../omareel_core" }

[build-dependencies]
cxx-qt-build = "0.10"
